[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studiobridge"
version = "0.1.0"
description = "AI agent & developer bridge to Image-Line FL Studio"
readme = "README.md"
license = "MIT"
authors = [
    { name = "WantedChip", email = "ty121rt@gmail.com" },
]
keywords = ["flstudio", "midi", "mcp", "ai-agent", "music-production", "daw"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "anyio>=4.0.0",
    "platformdirs>=4.0.0",
    "tomlkit>=0.13.0",
]

[project.optional-dependencies]
http = []
analysis = []
rtmidi = []
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "import-linter>=2.0",
    "pyright>=1.1.370",
    "ruff>=0.6.0",
]

[project.scripts]
sbridge = "studiobridge.cli:main"
studiobridge-mcp = "studiobridge.cli:main"

[project.urls]
Homepage = "https://github.com/WantedChip/studiobridge"
Repository = "https://github.com/WantedChip/studiobridge"
Issues = "https://github.com/WantedChip/studiobridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/studiobridge"]
