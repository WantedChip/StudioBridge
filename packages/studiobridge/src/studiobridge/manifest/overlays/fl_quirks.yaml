- fn: transport.setSongPos
  verify:
    getter: transport.getSongPos
    args: []
    compare: approx
    tol: 0.01
    settle: idle1
  note: "Song position update is asynchronous across audio engine buffer cycles."
  evidence:
    - "spike:S2"
  test: tests/live/test_song_pos.py
  severity: info

- fn: general.restore
  protected: true
  mutating: true
  note: "Potentially destructive undo history manipulation; protected call."
  evidence:
    - "spike:S1"
    - "il-forum-undo-crash"
  test: tests/live/test_undo_protection.py
  severity: warn

- fn: general.undo
  mutating: true
  note: "Direct undo manipulation changes project state without confirmation."
  evidence:
    - "spike:S1"
  test: tests/live/test_general_undo.py
  severity: warn
