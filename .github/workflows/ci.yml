name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --all-groups

      - name: Check code formatting (ruff format)
        run: uv run ruff format --check .

      - name: Check code style & lints (ruff check)
        run: uv run ruff check .

      - name: Typecheck (pyright)
        run: uv run pyright

      - name: Validate import layering (import-linter)
        run: uv run lint-imports

  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - os: windows-11-arm
            python-version: "3.12"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install workspace dependencies
        run: uv sync --all-groups

      - name: Run unit & smoke tests (pytest)
        run: uv run pytest -q

  build:
    name: Package Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build --package studiobridge

      - name: Verify universal wheel
        run: |
          ls -la dist/
          test -f dist/studiobridge-0.1.0-py3-none-any.whl
